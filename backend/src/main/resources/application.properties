# ========================================================
# Spring Boot College Management System Configuration
# ========================================================

server.port=8080

# Application Name
spring.application.name=college-management-system

# Active Profile:
# - 'mysql' for standard MySQL production / local database
# - 'dev' for standalone in-memory H2 database with automatic seed data
spring.profiles.active=dev

# MySQL Database DataSource Configuration (Active when using 'mysql' profile)
# Change username/password according to your local MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/college_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Enable SQL script initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true
